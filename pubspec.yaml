name: moying
description: "墨影 —— 一个现代暗色风格的书籍与电影记录应用（Flutter UI 框架 + 虚拟数据）"
publish_to: 'none'
version: 0.9.0+2

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  path_provider: ^2.1.4
  path: ^1.9.0                    # 跨平台路径拼接（library_store，防 Windows 分隔符差异）
  image_picker: ^1.1.2
  http: ^1.2.0                    # WebDAV 通信
  flutter_secure_storage: ^9.2.2  # WebDAV 凭据（Keystore/Keychain）
  archive: ^3.6.1                 # 含图备份 ZIP 打包（纯 Dart）
  share_plus: ^10.0.0             # 导出 JSON 到本地
  file_picker: ^8.0.0             # 从本地文件导入恢复
  connectivity_plus: ^6.0.5       # 自动同步 Wi-Fi 探测

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
